server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name kale2.peasy.com.tr 45.87.173.55;
    client_max_body_size 55m;
    # Cloudflare arkasında: yönlendirmeler göreli kalsın (yoksa nginx iç portu 8080'i ekliyor)
    absolute_redirect off;

    # Oyun indirmesi. Dosyalar GitHub Releases'te (berken55/kale2-web, etiket client-<sürüm>): site adresi
    # /indir/Kale2-<sürüm>.zip oraya yönlenir, indirme GitHub'ın CDN'inden gelir. /indir/Kale2.zip hep son sürüm.
    # latest.json site her açıldığında güncel sürümü buradan okur. Sunucudaki kopya yedek: /indir/yedek/...
    location = /indir/latest.json {
        alias /var/www/kale2-downloads/latest.json;
        add_header Cache-Control "no-cache";
    }
    location = /indir/Kale2.zip {
        add_header Cache-Control "no-cache";
        return 302 /indir/Kale2-2026.10.17-1.zip;
    }
    location ~ ^/indir/Kale2-([0-9A-Za-z.\-]+)\.zip$ {
        add_header Cache-Control "public, max-age=3600";
        return 302 https://github.com/berken55/kale2-web/releases/download/client-$1/Kale2-$1.zip;
    }
    location /indir/yedek/ {
        alias /var/www/kale2-downloads/;
        limit_rate_after 10m;
        limit_rate 25m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
