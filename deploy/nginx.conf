server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name kale2.peasy.com.tr 45.87.173.55;
    client_max_body_size 55m;

    # Oyun indirmesi: /var/www/kale2-downloads (Kale2-<sürüm>.zip + latest.json). Sürümlü dosya adı değişmez,
    # uzun önbellek; latest.json site her açıldığında güncel sürümü buradan okur. Kişi başı hız sınırı oyun
    # sunucusunun (aynı makine) gecikmesini korur; yarıda kalan indirme kaldığı yerden devam eder (Range).
    location = /indir/latest.json {
        alias /var/www/kale2-downloads/latest.json;
        add_header Cache-Control "no-cache";
    }
    location /indir/ {
        alias /var/www/kale2-downloads/;
        limit_rate_after 10m;
        limit_rate 25m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
